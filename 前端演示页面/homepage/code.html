<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dream Weaver Dashboard</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FFFFFF",
                        secondary: "#E2E8F0",
                        "background-light": "#E0E7FF",
                        "background-dark": "#020617", 
                        "glass-border-light": "rgba(255, 255, 255, 0.4)",
                        "glass-border-dark": "rgba(255, 255, 255, 0.1)",
                        "glass-surface-light": "rgba(255, 255, 255, 0.4)",
                        "glass-surface-dark": "rgba(15, 23, 42, 0.3)",
                    },
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans SC"', 'sans-serif'],
                        display: ['"Noto Sans SC"', 'sans-serif'],
                    },
                    boxShadow: {
                        'glow-primary': '0 0 20px rgba(255, 255, 255, 0.5)',
                        'glow-secondary': '0 0 20px rgba(226, 232, 240, 0.5)',
                    }
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        .glass-panel {
            @apply backdrop-blur-xl;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .dark .glass-panel {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glass-card-inner {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card-inner {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stars-bg {
            background-color: #050b14;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.3) 1px, transparent 1.5px),
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 1.5px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 1.5px),
                radial-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 200px 200px, 150px 150px, 100px 100px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px, 20px 20px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); border-color: rgba(255, 255, 255, 0.6); }
            50% { box-shadow: 0 0 25px rgba(255, 255, 255, 0.6); border-color: rgba(255, 255, 255, 0.9); }
        }
        .active-nav-glow {
            animation: pulse-glow 3s infinite;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen w-full overflow-x-hidden bg-background-light dark:bg-background-dark text-slate-700 dark:text-slate-200 transition-colors duration-300 dark">
<div class="fixed inset-0 z-0 bg-[#020617]">
<div class="absolute inset-0 stars-bg opacity-90"></div>
<div class="absolute inset-0 opacity-[0.05] pointer-events-none mix-blend-overlay" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB0ukr8EmbPTiH6qnT0LKhWPhCNrSsdj1dNzBWYJhQ2tE1wpsdtV78aw5sgwdvlu4EQTF5OhciE2MvtIfBvJpp6Llt28tEGi1x38ugUf2txOWb46igRiRuANljchSKgThPZZDTS-7tmXGQfpCOKAMb2GdiE5Rc5UZ2kM5SYVPdImkUX6OYUQN5cf176KUaUq75UoZ7piKXgLbteIXZdnkHFRP2OwIFOqmyMmo6B9mkhiWxWQ-6-L8WGf14JhUvqzuYSE795lgw8O6Y');"></div>
<div class="absolute inset-0 bg-radial-gradient from-transparent to-[#000000] opacity-60 pointer-events-none" style="background-image: radial-gradient(circle at center, transparent 40%, #000 100%);"></div>
</div>
<div class="relative z-10 flex flex-col md:flex-row h-screen">
<nav class="hidden md:flex w-64 h-full flex-col py-8 glass-panel border-r border-glass-border-light dark:border-glass-border-dark z-50">
<div class="px-6 mb-10 flex items-center space-x-3">
<div class="w-10 h-10 rounded-xl bg-white flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.4)] flex-shrink-0">
<span class="material-icons-round text-slate-900 text-xl">auto_awesome</span>
</div>
<h1 class="font-display font-bold text-lg text-slate-800 dark:text-white tracking-wide">Dream Weaver</h1>
</div>
<div class="flex flex-col space-y-3 w-full px-4">
<button class="flex items-center space-x-3 w-full p-3 rounded-xl bg-white/10 text-white shadow-[0_0_20px_rgba(255,255,255,0.2)] backdrop-blur-sm transition active-nav-glow border border-white">
<div class="p-1.5 rounded-lg bg-white/20 text-white">
<span class="material-icons-round text-xl">psychology</span>
</div>
<span class="font-medium text-sm">梦境分析</span>
</button>
<button class="flex items-center space-x-3 w-full p-3 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-white/10 transition hover:text-white group">
<div class="p-1.5 rounded-lg bg-transparent group-hover:bg-white/10 text-slate-400 group-hover:text-white transition-colors">
<span class="material-icons-round text-xl">monitor_heart</span>
</div>
<span class="font-medium text-sm">生理数据</span>
</button>
<button class="flex items-center space-x-3 w-full p-3 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-white/10 transition hover:text-white group">
<div class="p-1.5 rounded-lg bg-transparent group-hover:bg-white/10 text-slate-400 group-hover:text-white transition-colors">
<span class="material-icons-round text-xl">ssid_chart</span>
</div>
<span class="font-medium text-sm">脑电波分析</span>
</button>
<button class="flex items-center space-x-3 w-full p-3 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-white/10 transition hover:text-white group">
<div class="p-1.5 rounded-lg bg-transparent group-hover:bg-white/10 text-slate-400 group-hover:text-white transition-colors">
<span class="material-icons-round text-xl">description</span>
</div>
<span class="font-medium text-sm">我的报告</span>
</button>
</div>
<div class="mt-auto px-4 w-full">
<div class="p-4 rounded-xl bg-white/5 border border-white/10">
<div class="flex items-center justify-between mb-3">
<span class="text-xs font-medium text-slate-300 uppercase tracking-wider">Theme</span>
<span class="material-icons-round text-white text-sm">palette</span>
</div>
<div class="flex items-center justify-between bg-black/20 rounded-lg p-1 border border-white/5">
<button class="flex-1 flex items-center justify-center py-1.5 rounded-md text-slate-500 hover:text-white transition-colors">
<span class="material-icons-round text-sm">dark_mode</span>
</button>
<button class="flex-1 flex items-center justify-center py-1.5 rounded-md bg-white text-slate-900 shadow-lg shadow-white/20 transition-all">
<span class="material-icons-round text-sm">wb_sunny</span>
</button>
</div>
</div>
</div>
</nav>
<header class="md:hidden flex items-center justify-between px-6 py-4 glass-panel border-b border-white/10 sticky top-0 z-50">
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center shadow-glow-primary">
<span class="material-icons-round text-slate-900 text-base">auto_awesome</span>
</div>
<h1 class="font-display font-bold text-sm text-white tracking-tight">Dream Weaver</h1>
</div>
<div class="flex items-center space-x-3">
<button class="p-2 rounded-full bg-white/10 text-white border border-white/20">
<span class="material-icons-round text-lg">wb_sunny</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col relative overflow-y-auto pb-24 md:pb-10 px-4 py-8 md:px-12 md:py-10">
<header class="text-center mb-8 md:mb-10 floating">
<h1 class="text-2xl md:text-4xl font-display font-light tracking-wide text-slate-800 dark:text-white mb-2 [text-shadow:0_2px_10px_rgba(0,0,0,0.5)]">
                    解析潜意识的星图
                </h1>
<p class="text-[10px] md:text-sm text-slate-500 dark:text-slate-300 tracking-[0.2em] uppercase opacity-80 px-4">
                    Analyzing the star map of the subconscious
                </p>
</header>
<section class="w-full max-w-5xl mx-auto glass-panel rounded-2xl md:rounded-3xl p-6 md:p-10 shadow-2xl relative mb-8">
<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
<div class="flex items-baseline space-x-3 mb-4 md:mb-0">
<h2 class="text-lg md:text-xl font-medium text-slate-800 dark:text-white">输入梦境内容</h2>
<span class="hidden sm:inline text-sm text-slate-500 dark:text-slate-400 font-light">Describe your dreamscape</span>
</div>
</div>
<div class="flex flex-wrap gap-2 mb-6">
<button class="flex items-center space-x-2 px-4 py-2 rounded-full glass-card-inner text-xs md:text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-white/10 transition border border-white/20">
<span class="material-icons-round text-base">image</span>
<span>上传视觉碎片</span>
</button>
<button class="flex items-center space-x-2 px-4 py-2 rounded-full glass-card-inner text-xs md:text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-white/10 transition border border-white/20">
<span class="material-icons-round text-base">mic</span>
<span>上传音频</span>
</button>
</div>
<div class="relative group mb-8">
<textarea class="w-full h-40 md:h-56 rounded-2xl bg-white/50 dark:bg-slate-900/30 border border-white/40 dark:border-white/10 p-5 md:p-6 text-slate-700 dark:text-slate-200 placeholder-slate-400/70 focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all resize-none shadow-inner text-base md:text-lg leading-relaxed" placeholder="我看见时间在倒流，巨大的鲸鱼游过云层..."></textarea>
<button class="absolute bottom-4 right-4 flex items-center space-x-2 bg-white text-slate-900 px-4 py-2 md:px-5 md:py-2.5 rounded-full shadow-glow-primary hover:scale-105 transition-all transform active:scale-95 border border-white/50">
<span class="material-icons-round text-base md:text-lg">mic</span>
<span class="text-xs md:text-sm font-medium tracking-wide">语音输入</span>
</button>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-8">
<button class="flex items-center justify-center space-x-2 py-3 px-2 rounded-xl glass-card-inner hover:bg-white/10 transition group border border-white/10">
<span class="material-icons-round text-slate-400 group-hover:text-white text-sm">psychology</span>
<span class="text-xs md:text-sm text-slate-200 font-medium group-hover:text-white">深度解析</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-2 rounded-xl glass-card-inner hover:bg-white/10 transition group border border-white/10">
<span class="material-icons-round text-slate-400 group-hover:text-white text-sm">notes</span>
<span class="text-xs md:text-sm text-slate-200 font-medium group-hover:text-white">文本分析</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-2 rounded-xl glass-card-inner hover:bg-white/10 transition group border border-white/10">
<span class="material-icons-round text-slate-400 group-hover:text-white text-sm">visibility</span>
<span class="text-xs md:text-sm text-slate-200 font-medium group-hover:text-white">具象化梦境</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-2 rounded-xl glass-card-inner hover:bg-white/10 transition group border border-white/10">
<span class="material-icons-round text-slate-400 group-hover:text-white text-sm">timeline</span>
<span class="text-xs md:text-sm text-slate-200 font-medium group-hover:text-white">时光投影</span>
</button>
<button class="flex items-center justify-center space-x-2 py-3 px-2 rounded-xl glass-card-inner hover:bg-white/10 transition group border border-white/10 col-span-2 sm:col-span-1">
<span class="material-icons-round text-slate-400 group-hover:text-white text-sm">play_circle</span>
<span class="text-xs md:text-sm text-slate-200 font-medium group-hover:text-white">视频参数</span>
</button>
</div>
<div class="flex justify-start">
<button class="flex items-center space-x-2 py-2 px-4 rounded-full bg-white/5 text-slate-300 hover:bg-white/10 transition border border-white/5">
<span class="material-icons-round text-sm">history</span>
<span class="text-xs md:text-sm font-medium">查找往期回忆</span>
<span class="material-icons-round text-sm">chevron_right</span>
</button>
</div>
</section>
<section class="w-full max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
<div class="glass-panel rounded-2xl p-5 flex items-center space-x-4 hover:bg-white/10 transition cursor-default group border border-white/10">
<div class="p-3 rounded-full bg-white/10 text-slate-200 group-hover:text-white group-hover:bg-white/20 group-hover:scale-110 transition-all border border-white/5">
<span class="material-icons-round">bedtime</span>
</div>
<div>
<p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Sleep Quality</p>
<div class="flex items-end space-x-2">
<span class="text-xl md:text-2xl font-bold text-white group-hover:shadow-glow-primary">84%</span>
<span class="text-xs font-medium text-emerald-400 mb-1">+2%</span>
</div>
</div>
</div>
<div class="glass-panel rounded-2xl p-5 flex items-center space-x-4 hover:bg-white/10 transition cursor-default group border border-white/10">
<div class="p-3 rounded-full bg-white/10 text-slate-200 group-hover:text-white group-hover:bg-white/20 group-hover:scale-110 transition-all border border-white/5">
<span class="material-icons-round">auto_fix_high</span>
</div>
<div>
<p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Dream Vividness</p>
<div class="flex items-end space-x-2">
<span class="text-xl md:text-2xl font-bold text-white">High</span>
</div>
</div>
</div>
<div class="glass-panel rounded-2xl p-5 flex items-center space-x-4 hover:bg-white/10 transition cursor-default group border border-white/10 sm:col-span-2 lg:col-span-1">
<div class="p-3 rounded-full bg-white/10 text-slate-200 group-hover:text-white group-hover:bg-white/20 group-hover:scale-110 transition-all border border-white/5">
<span class="material-icons-round">ssid_chart</span>
</div>
<div>
<p class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">Analysis Status</p>
<div class="flex items-end space-x-2">
<span class="text-xl md:text-2xl font-bold text-white">Synched</span>
</div>
</div>
</div>
</section>
</main>
<nav class="md:hidden fixed bottom-0 left-0 right-0 h-20 glass-panel border-t border-white/10 z-[60] flex items-center justify-around px-2">

<div class="p-2 rounded-xl bg-white/20 shadow-glow-primary border border-white/50">
<span class="material-icons-round text-xl">psychology</span>
</div>
<span class="text-[10px] font-medium">梦境分析</span>
</button>
<button class="flex flex-col items-center space-y-1 text-slate-400">
<div class="p-2 rounded-xl hover:bg-white/10 transition-colors">
<span class="material-icons-round text-xl">monitor_heart</span>
</div>
<span class="text-[10px] font-medium">生理数据</span>
</button>
<button class="flex flex-col items-center space-y-1 text-slate-400">
<div class="p-2 rounded-xl hover:bg-white/10 transition-colors">
<span class="material-icons-round text-xl">ssid_chart</span>
</div>
<span class="text-[10px] font-medium">脑电波分析</span>
</button>
<button class="flex flex-col items-center space-y-1 text-slate-400">
<div class="p-2 rounded-xl hover:bg-white/10 transition-colors">
<span class="material-icons-round text-xl">description</span>
</div>
<span class="text-[10px] font-medium">我的报告</span>
</button>
</nav>
</div>
